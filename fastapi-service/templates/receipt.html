<html>
<head>
<style>
  body { font-family: Helvetica, sans-serif; font-size: 12px; color: #222; }
  h1 { font-size: 18px; margin-bottom: 0; }
  .muted { color: #666; }
  table { margin-top: 16px; width: 100%; }
  td { padding: 4px 0; }
  .label { color: #666; width: 160px; }
</style>
</head>
<body>
  <h1>{{ business_name }}</h1>
  <div class="muted">Payment Receipt #{{ receipt_no }} — {{ date }}</div>

  <table>
    <tr><td class="label">Received from</td><td>{{ customer_name }} ({{ customer_phone }})</td></tr>
    <tr><td class="label">Amount</td><td>{{ currency_code }} {{ amount }}</td></tr>
    <tr><td class="label">Payment method</td><td>{{ payment_method }}</td></tr>
    <tr><td class="label">Balance after</td><td>{{ currency_code }} {{ balance_after }}</td></tr>
  </table>
</body>
</html>
